# Redis Sentinel Configuration for HA
# Master name: mymaster
# Master auth: (none for local dev)
# Sentinel monitors master and promotes replica on failure

port 26379
sentinel monitor mymaster bucketshield-redis-master 6379 2
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 10000
sentinel parallel-syncs mymaster 1

# No auth for local dev
# sentinel auth-pass mymaster <password>

# Log level
loglevel notice