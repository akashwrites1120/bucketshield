# High Availability deployment with Redis Sentinel
# Usage: docker-compose -f docker-compose.ha.yml up -d

services:
  # Redis Master
  redis-master:
    image: redis:7-alpine
    container_name: bucketshield-redis-master
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_master_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis Replica 1
  redis-replica-1:
    image: redis:7-alpine
    container_name: bucketshield-redis-replica-1
    command: redis-server --replicaof redis-master 6379 --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis_replica1_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis Replica 2
  redis-replica-2:
    image: redis:7-alpine
    container_name: bucketshield-redis-replica-2
    command: redis-server --replicaof redis-master 6379 --appendonly yes
    ports:
      - "6381:6379"
    volumes:
      - redis_replica2_data:/data
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Redis Sentinel 1
  sentinel-1:
    image: redis:7-alpine
    container_name: bucketshield-sentinel-1
    command: sh /entrypoint.sh
    ports:
      - "26379:26379"
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
      - ./redis/sentinel-entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy

  # Redis Sentinel 2
  sentinel-2:
    image: redis:7-alpine
    container_name: bucketshield-sentinel-2
    command: sh /entrypoint.sh
    ports:
      - "26380:26379"
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
      - ./redis/sentinel-entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy

  # Redis Sentinel 3
  sentinel-3:
    image: redis:7-alpine
    container_name: bucketshield-sentinel-3
    command: sh /entrypoint.sh
    ports:
      - "26381:26379"
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf:ro
      - ./redis/sentinel-entrypoint.sh:/entrypoint.sh:ro
    depends_on:
      redis-master:
        condition: service_healthy
      redis-replica-1:
        condition: service_healthy
      redis-replica-2:
        condition: service_healthy

  # Backend 1 (uses Sentinel for Redis discovery)
  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bucketshield-backend-1
    environment:
      - PORT=8080
      - REDIS_SENTINEL_ADDRS=sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      - REDIS_MASTER_NAME=mymaster
      - DEFAULT_MAX_TOKENS=10.0
      - DEFAULT_REFILL_RATE=2.0
      - FAIL_OPEN=false
    depends_on:
      sentinel-1:
        condition: service_started
      sentinel-2:
        condition: service_started
      sentinel-3:
        condition: service_started

  # Backend 2
  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bucketshield-backend-2
    environment:
      - PORT=8080
      - REDIS_SENTINEL_ADDRS=sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      - REDIS_MASTER_NAME=mymaster
      - DEFAULT_MAX_TOKENS=10.0
      - DEFAULT_REFILL_RATE=2.0
      - FAIL_OPEN=false
    depends_on:
      sentinel-1:
        condition: service_started
      sentinel-2:
        condition: service_started
      sentinel-3:
        condition: service_started

  # Load Balancer
  loadbalancer:
    image: nginx:alpine
    container_name: bucketshield-loadbalancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2

volumes:
  redis_master_data:
  redis_replica1_data:
  redis_replica2_data: