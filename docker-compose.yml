services:
  redis:
    image: redis:7-alpine
    container_name: bucketshield-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bucketshield-backend-1
    environment:
      - PORT=8080
      - REDIS_ADDR=redis:6379
      - DEFAULT_MAX_TOKENS=10.0
      - DEFAULT_REFILL_RATE=2.0
      - FAIL_OPEN=false
    depends_on:
      - redis

  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bucketshield-backend-2
    environment:
      - PORT=8080
      - REDIS_ADDR=redis:6379
      - DEFAULT_MAX_TOKENS=10.0
      - DEFAULT_REFILL_RATE=2.0
      - FAIL_OPEN=false
    depends_on:
      - redis

  loadbalancer:
    image: nginx:alpine
    container_name: bucketshield-loadbalancer
    ports:
      - "8081:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2

volumes:
  redis_data:
